[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"

requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.31.0",
  "beautifulsoup4>=4.14.3",
  "boto3>=1.35.0",
  "cryptography>=48.0.0",
  "fastapi>=0.136.3",
  "httpx>=0.28.1",
  "lxml>=6.1.1",
  "openai>=2.38.0",
  "pdf2image>=1.17.0",
  "pgvector>=0.4.2",
  "pillow>=12.2.0",
  "pydantic-settings>=2.14.1",
  "pyjwt>=2.13.0",
  "python-multipart>=0.0.20",
  "pypdf>=6.12.1",
  "pytesseract>=0.3.13",
  "python-docx>=1.2.0",
  "slowapi>=0.1.9",
  "sqlalchemy[asyncio]>=2.0.50",
  "structlog>=25.5.0",
  "tiktoken>=0.13.0",
  "uvicorn[standard]>=0.48.0",
  "voyageai>=0.3.7",
  "litellm>=1.55.0",
]

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperpilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
