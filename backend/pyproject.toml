[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"

requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.31.0",
  "beautifulsoup4>=4.14.3",
  "cryptography>=48.0.0",
  "fastapi>=0.136.3",
  "httpx>=0.28.1",
  "lxml>=6.1.1",
  "openai>=2.38.0",
  "pdf2image>=1.17.0",
  "pgvector>=0.4.2",
  "pillow>=12.2.0",
  "pydantic-settings>=2.14.1",
  "pyjwt>=2.13.0",
  "python-multipart>=0.0.20",
  "pypdf>=6.12.1",
  "pytesseract>=0.3.13",
  "python-docx>=1.2.0",
  "rank-bm25>=0.2.2",
  "slowapi>=0.1.9",
  "sqlalchemy[asyncio]>=2.0.50",
  "structlog>=25.5.0",
  "tiktoken>=0.13.0",
  "uvicorn[standard]>=0.48.0",
  "voyageai>=0.3.7",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperpilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
