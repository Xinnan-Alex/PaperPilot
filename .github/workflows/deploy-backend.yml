name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  id-token: write      # required for OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-5
  ECR_REPO: paperpilot-api
  EC2_INSTANCE_ID: i-0d9cf1ff5e90ab896

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::501519530452:role/paperpilot-ci
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build + push
        env:
          REG: ${{ steps.ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 \
            -t $REG/$ECR_REPO:latest \
            -t $REG/$ECR_REPO:${{ github.sha }} \
            --push ./backend

      - name: Restart on EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.sha }}" \
            --parameters 'commands=[
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"${{ steps.ecr.outputs.registry }}"'",
              "docker pull '"${{ steps.ecr.outputs.registry }}"'/'"$ECR_REPO"':latest",
              "aws ssm get-parameters-by-path --path /paperpilot/ --with-decryption --region '"$AWS_REGION"' --query \"Parameters[].[Name,Value]\" --output text | sed \"s#/paperpilot/##\" | awk \"{print \\$1\\\"=\\\"\\$2}\" > /run/paperpilot.env",
              "docker rm -f paperpilot || true",
              "docker run -d --name paperpilot --restart unless-stopped -p 10000:10000 --env-file /run/paperpilot.env '"${{ steps.ecr.outputs.registry }}"'/'"$ECR_REPO"':latest"
            ]'
