name: Keep Backend Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "BACKEND_URL secret not set; skipping."
            exit 0
          fi

          for i in {1..3}; do
            echo "Attempt $i..."
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 --connect-timeout 10 "${{ secrets.BACKEND_URL }}/health")
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done

          echo "Failed to reach backend after 3 attempts"
          exit 1
